name: Android CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests & build debug APK
        env:
          KONTEKSCEK_API_BASE_URL: ${{ vars.KONTEKSCEK_API_BASE_URL }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug -Pkontekscek.apiBaseUrl="${KONTEKSCEK_API_BASE_URL:-}" --stacktrace --no-daemon

      - name: Prepare APK artifact
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          APK_NAME="KonteksCek-v${VERSION_NAME}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          (cd dist && sha256sum "${APK_NAME}" > SHA256SUMS.txt)
          {
            echo "### KonteksCek v${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo ""
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: kontekscek-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  backend:
    name: Build backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build Ktor backend
        working-directory: backend-ktor
        run: ../gradlew build --no-daemon

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kontekscek-apk
          path: release

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APK=$(find release -maxdepth 1 -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan" >&2
            exit 1
          fi
          APK_BASENAME=$(basename "$APK")
          SHA256=$(cut -d' ' -f1 release/SHA256SUMS.txt)

          {
            echo "KonteksCek adalah Prompt Coach Android untuk memeriksa dan memperbaiki prompt AI,"
            echo "menyensor data sensitif di perangkat, lalu mencatat jejak verifikasi manusia."
            echo ""
            echo "## Fitur"
            echo ""
            echo "- Cek prompt + jawaban AI: skor 0-100, masalah, prompt perbaikan siap salin."
            echo "- Privacy Guard lokal: API key, password, email, nomor HP, kartu/NIK disensor sebelum dikirim."
            echo "- Share Sheet & Process Text: kirim teks dari ChatGPT/Gemini/Chrome/WhatsApp ke KonteksCek."
            echo "- Cek jawaban AI, pertanyaan klarifikasi, dan prompt tindak lanjut."
            echo "- Lint lokal offline saat server belum diatur atau tidak tersedia."
            echo "- Mode Manual lama (lokal penuh), PDF jejak, preset konteks, dan cadangan JSON."
            echo "- Tema terang/gelap/sistem dan ukuran teks Besar."
            echo ""
            echo "## Instalasi"
            echo ""
            echo "1. Unduh \`${APK_BASENAME}\` di bawah."
            echo "2. Izinkan pemasangan dari sumber tidak dikenal bila diminta Android."
            echo "3. Buka APK lalu instal."
            echo ""
            echo "APK ini di-sign dengan debug key untuk sideloading, bukan untuk Play Store."
            echo "Minimal Android 8.0 (API 26). Tanpa server, aplikasi memakai lint lokal;"
            echo "isi URL server di Pengaturan untuk analisis AI."
            echo ""
            echo "### SHA-256"
            echo ""
            echo '```'
            echo "$SHA256  $APK_BASENAME"
            echo '```'
            echo ""
            echo "Dibangun otomatis dari commit \`${GITHUB_SHA}\` oleh GitHub Actions."
          } > notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "KonteksCek $TAG" --notes-file notes.md
          else
            RELEASE_FLAG="--latest"
            case "$TAG" in
              *beta*|*rc*) RELEASE_FLAG="--prerelease" ;;
            esac
            gh release create "$TAG" "$APK" release/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "KonteksCek $TAG" \
              --notes-file notes.md \
              $RELEASE_FLAG
          fi

      - name: Release summary
        run: |
          {
            echo "### Rilis $GITHUB_REF_NAME"
            echo ""
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
