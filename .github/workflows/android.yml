name: Android CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests & build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK artifact
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          APK_NAME="KonteksCek-v${VERSION_NAME}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          (cd dist && sha256sum "${APK_NAME}" > SHA256SUMS.txt)
          {
            echo "### KonteksCek v${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo ""
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: kontekscek-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kontekscek-apk
          path: release

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APK=$(find release -maxdepth 1 -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan" >&2
            exit 1
          fi
          APK_BASENAME=$(basename "$APK")
          SHA256=$(cut -d' ' -f1 release/SHA256SUMS.txt)

          {
            echo "KonteksCek adalah aplikasi Android untuk memeriksa kesesuaian konteks"
            echo "output AI dan mencatat jejak verifikasi manusia, 100% lokal di perangkat."
            echo ""
            echo "## Fitur"
            echo ""
            echo "- Kartu Konteks 5 isian: tujuan, audiens/standar mutu, etika & sumber, format/bahasa, data terlarang."
            echo "- Pemindai berbasis aturan: kebocoran data terlarang, pola kredensial, klaim angka tanpa sumber, teks placeholder AI."
            echo "- Daftar periksa per mode (Kuliah, Kerja, Klien) dengan status Belum / Sudah / Diubah."
            echo "- Stopwatch target <= 5 menit dan catatan jejak 3 tahap (diminta -> diperiksa -> diubah)."
            echo "- Ekspor PDF jejak verifikasi dan cadangan data JSON, seluruhnya diproses di perangkat."
            echo "- Tema terang/gelap/sistem, ukuran teks, dashboard aktivitas 7 hari dan streak."
            echo ""
            echo "## Instalasi"
            echo ""
            echo "1. Unduh \`${APK_BASENAME}\` di bawah."
            echo "2. Izinkan pemasangan dari sumber tidak dikenal bila diminta Android."
            echo "3. Buka APK lalu instal."
            echo ""
            echo "APK ini di-sign dengan debug key untuk sideloading, bukan untuk Play Store."
            echo "Minimal Android 8.0 (API 26). Tidak perlu server atau koneksi internet."
            echo ""
            echo "### SHA-256"
            echo ""
            echo '```'
            echo "$SHA256  $APK_BASENAME"
            echo '```'
            echo ""
            echo "Dibangun otomatis dari commit \`${GITHUB_SHA}\` oleh GitHub Actions."
          } > notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "KonteksCek $TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$APK" release/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "KonteksCek $TAG" \
              --notes-file notes.md \
              --latest
          fi

      - name: Release summary
        run: |
          {
            echo "### Rilis $GITHUB_REF_NAME"
            echo ""
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
